name: Gunluk yayin

on:
  schedule:
    - cron: '0 9 * * *'   # 12:00 Türkiye saati (UTC+3)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Yayınla (iptal yoksa)
        run: python ada_instagram_post.py publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Depoya kaydet
        if: always()
        run: |
          git config user.name "ada-bot"
          git config user.email "ada-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Yayin durumu $(date -u +%F)" && git pull --rebase && git push)
